<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>PTZ Hockey Controller</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/rink.css') }}">

</head>

<body>

<!-- ========================= -->
<!-- Settings -->
<!-- ========================= -->

<a href="/settings"
   class="settings-button"
   title="Settings">
    ⚙️
</a>

<!-- ========================= -->
<!-- Rink -->
<!-- ========================= -->

<svg
    viewBox="0 0 1000 500"
    width="100%"
    class="rink"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->

    <rect
        x="0"
        y="0"
        width="1000"
        height="500"
        rx="60"
        ry="60"
        class="rink-bg"/>

    <!-- Centre -->

    <line
        x1="500"
        y1="0"
        x2="500"
        y2="500"
        class="center-line"/>

    <!-- Blue Lines -->

    <line
        x1="250"
        y1="0"
        x2="250"
        y2="500"
        class="blue-line"/>

    <line
        x1="750"
        y1="0"
        x2="750"
        y2="500"
        class="blue-line"/>

    <!-- Centre Circle -->

    <circle
        cx="500"
        cy="250"
        r="60"
        class="center-circle"/>

    <!-- ========================= -->
    <!-- Drop Zones -->
    <!-- ========================= -->

    <g onclick="triggerPreset('left_top')">

        <circle
            cx="250"
            cy="140"
            r="75"
            class="drop-zone"/>

        <circle
            cx="250"
            cy="140"
            r="8"
            fill="red"/>

    </g>

    <g onclick="triggerPreset('left_bottom')">

        <circle
            cx="250"
            cy="360"
            r="75"
            class="drop-zone"/>

        <circle
            cx="250"
            cy="360"
            r="8"
            fill="red"/>

    </g>

    <g onclick="triggerPreset('centre')">

        <circle
            cx="500"
            cy="250"
            r="82"
            class="drop-zone"/>

        <circle
            cx="500"
            cy="250"
            r="8"
            fill="red"/>

    </g>

    <g onclick="triggerPreset('right_top')">

        <circle
            cx="750"
            cy="140"
            r="75"
            class="drop-zone"/>

        <circle
            cx="750"
            cy="140"
            r="8"
            fill="red"/>

    </g>

    <g onclick="triggerPreset('right_bottom')">

        <circle
            cx="750"
            cy="360"
            r="75"
            class="drop-zone"/>

        <circle
            cx="750"
            cy="360"
            r="8"
            fill="red"/>

    </g>

</svg>

<!-- ========================= -->
<!-- Special Presets -->
<!-- ========================= -->

<div class="control-bar">

    <button onclick="triggerPreset('goal_left')">
        🥅
        <span>Goal Left</span>
    </button>

    <button onclick="triggerPreset('goal_right')">
        🥅
        <span>Goal Right</span>
    </button>

    <button onclick="triggerPreset('dead_zone_left')">
        ✖
        <span>Dead Zone</span>
    </button>

    <button onclick="triggerPreset('away_bench')">
        🪑
        <span>Away Bench</span>
    </button>

    <button onclick="triggerPreset('home_bench')">
        🪑
        <span>Home Bench</span>
    </button>

    <button onclick="triggerPreset('sinbin')">
        🚫
        <span>Sin Bin</span>
    </button>

    <button onclick="triggerPreset('mom')">
        ⭐
        <span>MoM</span>
    </button>

</div>

<!-- ========================= -->
<!-- Camera Status -->
<!-- ========================= -->

<div id="camera-status-bar">

{% for camera in camera_status %}

<div class="camera-status">

{% if not camera.enabled %}

<span class="status-grey">●</span>

{% elif camera.online %}

<span class="status-green">●</span>

{% else %}

<span class="status-red">●</span>

{% endif %}

{{ camera.name }}

</div>

{% endfor %}

</div>

<footer>

Version 1608202601

</footer>

<script src="{{ url_for('static', filename='js/rink.js') }}"></script>

</body>
</html>
